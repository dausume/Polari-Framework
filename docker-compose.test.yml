# Docker Compose configuration for running Polari Framework tests
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# This configuration is separate from the development docker-compose.yml
# and is specifically designed for running the test suite.

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: polari-framework-tests
    environment:
      - DEPLOY_ENV=test
      - IN_DOCKER_CONTAINER=true
      - PYTHONUNBUFFERED=1
      # acct-0: the test-build knob — loads the opt-in testing/
      # module (accountability matrix). Normal builds never set it.
      - POLARI_TEST_BUILD=true
    # Tests will run and container will exit when complete
    # Use --abort-on-container-exit flag to stop all containers when tests finish
    # acct-0: the full capability matrix; exit code mirrors
    # blocking_green, test-results/test-report.yaml is the
    # pipeline-readable outcome. `python3 run_tests.py` is still
    # the quick unittest-only subset.
    # The trap hands the bind-mounted test-results/ back to the HOST user on
    # exit — the tests run as root (they write into image-owned /app), and
    # without this the host is left with root-owned test-results/ that later
    # breaks native builds with "Permission denied". Export UID/GID or it
    # falls back to 1000:1000. Exit code of run_matrix is preserved.
    command: sh -c 'trap "chown -R ${UID:-1000}:${GID:-1000} /app/test-results" EXIT; python3 -m testing.custom.run_matrix'
    # Optional: Mount volume for test results or coverage reports
    volumes:
      - ./test-results:/app/test-results:rw
    # No ports exposed - tests run internally
    # No network needed unless testing API endpoints externally
